[package]
name = "near-estate-city-migration"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
reverse = []
runtime = []
repair-npc = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }

[dependencies]
near-estate-contract = { path = "../estate", features = ["migration-types"] }
near-sdk = { version = "=5.30.1" }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "=0.24.0", features = ["experimental"] }
anyhow = "1"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
near-estate-migration-probe = { path = "../migration-probe" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
