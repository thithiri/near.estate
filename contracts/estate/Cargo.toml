[package]
name = "near-estate-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1" }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "=0.24.0", features = ["experimental"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
