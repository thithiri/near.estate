[package]
name = "near-estate-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Expose persisted model types to the one-time migration WASM without exporting
# the live contract's entry points from the migration binary.
migration-types = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }

[dependencies]
near-sdk = { version = "=5.30.1" }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
near-workspaces = { version = "=0.24.0", features = ["experimental"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
