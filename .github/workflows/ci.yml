name: CI
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ls nanoid decode-uri-component query-string --all
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run seed:check
      - run: npm run assets:check
      - run: npm run build
      - run: npm run build -w @estate/web
        env:
          VITE_ESTATE_CONTRACT_ID: ci-estate.testnet
      - run: npm run check
      - run: npx playwright install chromium --only-shell
      - run: npm run test:browser
      - run: npm run format:check
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run config:check
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path contracts/city-migration/Cargo.toml -- --check
      - run: cargo build --release --target wasm32-unknown-unknown -p near-estate-contract
      - run: cargo test --workspace
      - run: cargo test --manifest-path contracts/city-migration/Cargo.toml --features runtime --lib
      - run: cargo check --manifest-path contracts/city-migration/Cargo.toml --features runtime --example runtime_upgrade_testnet
      - run: cargo build --manifest-path contracts/city-migration/Cargo.toml --release --target wasm32-unknown-unknown --features runtime
      - run: cargo test --manifest-path contracts/city-migration/Cargo.toml --features runtime --test runtime_sandbox
      - run: npm run contract:layout:check
      - run: cargo test --manifest-path contracts/estate/Cargo.toml --example deploy_testnet
      - run: cargo test --manifest-path contracts/estate/Cargo.toml --example provision_moderator_key
      - run: cargo test --manifest-path contracts/estate/Cargo.toml --example provision_inspector_key
      - run: cargo test --manifest-path contracts/estate/Cargo.toml --example provision_expiry_key
      - run: cargo check --workspace --target wasm32-unknown-unknown
  containers:
    runs-on: ubuntu-latest
    env:
      VITE_ESTATE_CONTRACT_ID: ci-estate.testnet
      ESTATE_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate production service configuration
        run: docker compose -f infra/compose.yaml -f infra/compose.prod.yaml --profile indexer config --quiet
        env:
          ESTATE_HOST: ci.invalid
          INDEXER_START_HEIGHT: 1
      - name: Validate expiry and monitor production configuration
        run: docker compose -f infra/compose.yaml -f infra/compose.prod.yaml -f infra/compose.monitor.example.yaml -f infra/compose.expiry.example.yaml --profile indexer --profile monitor --profile expiry config --quiet
        env:
          ESTATE_HOST: ci.invalid
          INDEXER_START_HEIGHT: 1
          EXPIRY_ACCOUNT_ID: expiry.testnet
          EXPIRY_KEY_HOST_FILE: /tmp/expiry-key.json
          ESTATE_MONITOR_DAILY_BUDGET_USD_MICROS: 0
          ESTATE_MONITOR_WEBHOOK_URL: https://alerts.example.com
          ESTATE_MONITOR_TOKEN_HOST_FILE: /tmp/monitor-token
          ESTATE_MONITOR_EXPIRY_STATUS_FILE: /expiry-status/sweep.json
      - run: docker compose -f infra/compose.yaml --profile indexer build api indexer web
      - run: node scripts/verify-container-revisions.mjs ${{ github.sha }}
      - run: docker compose -f infra/compose.yaml up -d api web
      - name: Check packaged services
        run: |
          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/api/health \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl -fsS http://127.0.0.1:8080/api/paid-generations/status \
            | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"enabled": False}'
          curl -fsS http://127.0.0.1:8080/ \
            | python3 -c 'import sys; assert "near.estate" in sys.stdin.read()'
          curl -fsS http://127.0.0.1:8080/presets/cafe-2-l4.png -o /dev/null
          docker compose -f infra/compose.yaml exec -T api node -e \
            'require("sharp")(Buffer.from("<svg width=\"8\" height=\"8\"><rect width=\"8\" height=\"8\" fill=\"red\"/></svg>")).png().toBuffer().then(x=>{if(x.length<50)process.exit(1)})'
          docker compose -f infra/compose.yaml exec -T api test -f /app/services/api/dist/run-expiry.js
          docker compose -f infra/compose.yaml --profile indexer run --rm --no-deps --entrypoint node indexer \
            -e 'import("/app/services/worker/dist/event-store.js").catch(e=>{console.error(e);process.exit(1)})'
      - name: Check packaged wallet chooser and script policy
        run: |
          npm ci
          npx playwright install chromium --only-shell
          node scripts/check-packaged-browser.mjs
      - name: Check production HTTPS routing with local trust root
        env:
          ESTATE_HOST: localhost
          INDEXER_START_HEIGHT: 1
        run: |
          docker compose -f infra/compose.yaml -f infra/compose.prod.yaml up -d --no-build api web
          root_cert=$(mktemp)
          for attempt in $(seq 1 20); do
            if docker compose -f infra/compose.yaml -f infra/compose.prod.yaml exec -T web \
              cat /data/caddy/pki/authorities/local/root.crt > "$root_cert" 2>/dev/null && test -s "$root_cert"; then
              break
            fi
            sleep 1
          done
          test -s "$root_cert"
          curl --cacert "$root_cert" -fsS --retry 20 --retry-all-errors --retry-delay 2 \
            https://localhost/api/health \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl --cacert "$root_cert" -fsS https://localhost/api/paid-generations/status \
            | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"enabled": False}'
          docker compose -f infra/compose.yaml -f infra/compose.prod.yaml exec -T api node -e \
            'if (process.env.IMAGE_GENERATION_ENABLED !== "false" || process.env.OPENAI_API_KEY) process.exit(1)'
          curl --cacert "$root_cert" -fsS https://localhost/ \
            | python3 -c 'import sys; assert "near.estate" in sys.stdin.read()'
          test "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost/)" = "308 https://localhost/"
          rm "$root_cert"
      - if: always()
        env:
          ESTATE_HOST: localhost
          INDEXER_START_HEIGHT: 1
        run: docker compose -f infra/compose.yaml -f infra/compose.prod.yaml down -v --remove-orphans
