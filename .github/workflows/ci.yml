name: CI
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ls nanoid decode-uri-component query-string --all
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run seed:check
      - run: npm run assets:check
      - run: npm run build
      - run: npm run build -w @estate/web
        env:
          VITE_ESTATE_CONTRACT_ID: ci-estate.testnet
      - run: npm run check
      - run: npx playwright install chromium --with-deps --only-shell
      - run: npm run test:browser
      - run: npm run format:check
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run config:check
      - run: cargo fmt --all -- --check
      - run: cargo build --release --target wasm32-unknown-unknown -p near-estate-contract
      - run: cargo test --workspace
      - run: npm run contract:layout:check
      - run: cargo test --manifest-path contracts/estate/Cargo.toml --example deploy_testnet
      - run: cargo check --workspace --target wasm32-unknown-unknown
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose.yaml --profile indexer build api indexer web
        env:
          VITE_ESTATE_CONTRACT_ID: ci-estate.testnet
