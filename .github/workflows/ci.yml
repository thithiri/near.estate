name: CI
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seed:check
      - run: npm run assets:check
      - run: npm run build
      - run: npm run build -w @estate/web
        env:
          VITE_ESTATE_CONTRACT_ID: ci-estate.testnet
      - run: npm run check
      - run: npm run format:check
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run config:check
      - run: cargo fmt --all -- --check
      - run: cargo build --release --target wasm32-unknown-unknown -p near-estate-contract
      - run: cargo test --workspace
      - run: cargo test --manifest-path contracts/estate/Cargo.toml --example deploy_testnet
      - run: cargo check --workspace --target wasm32-unknown-unknown
